<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b3fa0"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7f2fb"/>
    </linearGradient>
  </defs>
  <!-- tile with the GNOME icon shadow edge -->
  <rect x="8" y="12" width="112" height="108" rx="20" fill="#1b1a33"/>
  <rect x="8" y="8" width="112" height="106" rx="20" fill="url(#bg)"/>
  <!-- the ephyra: an eight-armed young jellyfish seen from above -->
  <g transform="translate(64 60)">
    <g fill="url(#bell)">
      <path id="arm" d="M -7 -4 C -8 -20 -6 -34 0 -40 C 6 -34 8 -20 7 -4 Z"/>
      <use href="#arm" transform="rotate(45)"/>
      <use href="#arm" transform="rotate(90)"/>
      <use href="#arm" transform="rotate(135)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(225)"/>
      <use href="#arm" transform="rotate(270)"/>
      <use href="#arm" transform="rotate(315)"/>
    </g>
    <circle r="16" fill="#ffffff"/>
    <!-- play symbol in the centre -->
    <path d="M -5 -8 L 9 0 L -5 8 Z" fill="#3a6fb0"/>
  </g>
</svg>
